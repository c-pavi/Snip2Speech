[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snip2speech"
version = "0.2.0"
description = "Select any screen region on macOS, OCR it, and hear it read aloud."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "pandas>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jiwer>=3.0",
]

[project.scripts]
snip2speech = "snip2speech.cli:main"

[tool.setuptools.packages.find]
include = ["snip2speech*"]
